# Enable Home Assistant API
api:
  encryption:
    key: !secret comfoair_encryption_key
  # Same names as the old custom services, so Home Assistant automations
  # calling esphome.comfoair_climate_set_* keep working.
  actions:
    - action: climate_set_operation_mode
      variables:
        exhaust_fan: bool
        supply_fan: bool
      then:
        - lambda: "id(comfoair_climate).set_operation_mode(exhaust_fan, supply_fan);"
    - action: climate_set_speeds
      variables:
        exhaust_fan: bool
        supply_fan: bool
        "off": int
        low: int
        mid: int
        high: int
      then:
        - lambda: "id(comfoair_climate).set_speeds(exhaust_fan, supply_fan, off, low, mid, high);"
    - action: climate_set_current_mode_speeds
      variables:
        exhaust: int
        supply: int
      then:
        - lambda: "id(comfoair_climate).set_current_mode_speeds(exhaust, supply);"

ota:
  - platform: esphome
    password: !secret comfoair_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Comfoair Fallback Hotspot"
    password: !secret comfoair_ap_password

captive_portal:
    
