esphome:
  name: comfoair

esp8266:
  board: nodemcu

# Disable uart logging
logger:
  baud_rate: 0

# Resource baseline: compare these against the esp8266-baseline branch.
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap free"
    block:
      name: "Heap max block"
    fragmentation:
      name: "Heap fragmentation"
    loop_time:
      name: "Loop time"
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"

binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO4
      mode:
        input: true
        pullup: true
    name: "Mode button"
    filters:
      - invert:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
        - ON for at most 1s
        - OFF for at most 1s
        - ON for at most 1s
        - OFF for at least 0.2s
        then:
          lambda: "id(comfoair_climate).set_level(3);"
      - timing:
        - ON for 1s to 2s
        - OFF for at least 0.5s
        then:
          lambda: "id(comfoair_climate).set_level(1);"
      - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
        then:
          lambda: "id(comfoair_climate).set_level(2);"

uart:
- id: uart_bus
  baud_rate: 9600
  tx_pin: TX
  rx_pin: RX 
- id: uart_proxy
  baud_rate: 9600
  tx_pin: GPIO5
  rx_pin: GPIO14

external_components:
  - source:
      type: git
      url: https://github.com/julianpas/esphome-comfoair
      ref: upstream-sync
    refresh: 1min
    components: ["comfoair"]

button:
  - platform: restart
    id: reset_button
    name: "Reset Comfoair"
  - platform: template
    id: filter_reset_button
    name: "Reset Filter"
    on_press: 
      then:
        lambda: "id(comfoair_climate).reset_filters();"

switch:
  - platform: gpio
    pin: GPIO12
    name: "LED Green Light"
    id: green_led_gpio
  - platform: gpio
    pin: GPIO13
    name: "LED Blue Light"
    id: blue_led_gpio
  - platform: gpio
    pin: GPIO15
    name: "LED Red Light"
    id: red_led_gpio

comfoair:
  id: comfoair_climate
  name: "ComfoAir 310 SL"
  uart_id: uart_bus
  proxy_uart: uart_proxy
  connected:
    name: "Ventilation communication"
  response_age:
    name: "Ventilation response age"
  type:
    name: "type"
  size:
    name: "size"
  intake_fan_speed:
    name: "intake_fan_speed"
  exhaust_fan_speed:
    name: "exhaust_fan_speed"
  intake_fan_speed_rpm:
    name: "intake_fan_speed_rpm"
  exhaust_fan_speed_rpm:
    name: "exhaust_fan_speed_rpm"
  ventilation_level:
    name: "ventilation_level"
    # Status LEDs (-1 auto, 0 absent, 1 low, 2 medium, 3 high): green = auto,
    # low or medium; red = medium or high. Both stay dark at absent and while
    # the unit does not answer (NaN).
    on_value:
      - lambda: |-
          const bool known = !std::isnan(x);
          const int level = known ? (int) x : 0;
          const bool green = known && (level == -1 || level == 1 || level == 2);
          const bool red = known && (level == 2 || level == 3);
          if (green) id(green_led_gpio).turn_on(); else id(green_led_gpio).turn_off();
          if (red) id(red_led_gpio).turn_on(); else id(red_led_gpio).turn_off();
  bypass_present:
    name: "bypass_present"
  bypass_valve:
    name: "bypass_valve"
  bypass_valve_open:
    name: "bypass_valve_open"
  preheating_state:
    name: "preheating_state"
  outside_air_temperature:
    name: "outside_air_temperature"
  supply_air_temperature:
    name: "supply_air_temperature"
  return_air_temperature:
    name: "return_air_temperature"
  exhaust_air_temperature:
    name: "exhaust_air_temperature"
  enthalpy_temperature:
    name: "enthalpy_temperature"
  ewt_temperature:
    name: "ewt_temperature"
  reheating_temperature:
    name: "reheating_temperature"
  kitchen_hood_temperature:
    name: "kitchen_hood_temperature"
  return_air_level:
    name: "return_air_level"
  supply_air_level:
    name: "supply_air_level"
  supply_fan_active:
    name: "supply_fan_active"
  filter_status:
    name: "filter_status"
  filter_status_full:
    name: "is_filter_full"
    # Blue LED: filter needs replacing.
    on_state:
      - lambda: |-
          if (x) id(blue_led_gpio).turn_on(); else id(blue_led_gpio).turn_off();
  enthalpy_present:
    name: "enthalpy_present"
  ewt_present:
    name: "ewt_present"
  options_present:
    name: "options_present"
  fireplace_present:
    name: "fireplace_present"
